<!DOCTYPE html>
<html lang="en">
<head>
<!-- ================================================================================
     FOI PROJECT MASTER REGISTER — "ASTRA" THEME (card-based SaaS dashboard)
     Single-file frontend: HTML + CSS + vanilla JS. Served by Code.gs doGet().
     Sections: [1] HEAD/FONTS/CDN  [2] CSS DESIGN SYSTEM  [3] APP SHELL  [4] JS APP
     ================================================================================ -->
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FOI Project Master Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- ============================== [2] CSS DESIGN SYSTEM ============================== -->
<style>
/* ---- 2.1 Tokens ---- */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E5E9F2;
  --primary:#4F46E5; --primary-2:#7C3AED; --accent:#06B6D4;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
  --radius:16px; --radius-sm:10px;
  --shadow:0 4px 20px rgba(15,23,42,.06); --shadow-hover:0 10px 30px rgba(79,70,229,.15);
  --side-w:250px; --side-w-min:74px; --topbar-h:62px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A2E; --ink:#E5E7EB; --line:#222B45;
  --shadow:0 4px 20px rgba(0,0,0,.35); --shadow-hover:0 10px 30px rgba(79,70,229,.28);
}
/* ---- 2.2 Base ---- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
::placeholder{color:#9AA6BC}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
/* ---- 2.3 Layout ---- */
.app{display:flex;min-height:100vh}
.side{width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:width .2s ease,transform .2s ease}
.side.min{width:var(--side-w-min)}
.main{flex:1;margin-left:var(--side-w);display:flex;flex-direction:column;min-width:0;transition:margin-left .2s ease}
.side.min~.mainwait{}
.main.min{margin-left:var(--side-w-min)}
/* ---- 2.4 Sidebar ---- */
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand-logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.brand-name{font-weight:800;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden}
.brand-name small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.side.min .brand-name,.side.min .nav-label,.side.min .nav-sec,.side.min .side-user-tx{display:none}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 16px}
.nav::-webkit-scrollbar{width:4px}.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;margin:2px 0;border:0;background:transparent;border-radius:var(--radius-sm);color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .18s ease,color .18s ease;white-space:nowrap;position:relative}
.nav-item:hover{background:rgba(79,70,229,.07);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(79,70,229,.35)}
.nav-item.active:hover{color:#fff}
.nav-ic{width:19px;height:19px;flex:0 0 19px;display:flex}
.nav-item .badge{margin-left:auto}
.side.min .nav-item{justify-content:center;padding:10px 0}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.side-user{display:flex;align-items:center;gap:10px}
.side-user-tx{min-width:0}
.side-user-tx b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-tx span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.side-scrim{display:none}
/* ---- 2.5 Topbar ---- */
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:50}
.tb-ic{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s ease;flex:0 0 auto}
.tb-ic:hover{color:var(--primary);border-color:var(--primary);background:rgba(79,70,229,.06)}
.tb-ic .badge{position:absolute;transform:translate(14px,-13px)}
.tb-search{position:relative;flex:1;max-width:430px}
.tb-search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.tb-search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg)}
.tb-search input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.tb-city{width:132px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg)}
.tb-spacer{flex:1}
.tb-user{display:flex;align-items:center;gap:9px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.role-chip{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));padding:3px 8px;border-radius:999px;white-space:nowrap}
.tb-user-tx b{font-size:12.5px;display:block;white-space:nowrap}
/* ---- 2.6 Dropdown panels ---- */
.dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:300px;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-hover);padding:8px;display:none;z-index:80;max-height:70vh;overflow:auto}
.dropdown.open{display:block;animation:fadeSlide .18s ease}
.dd-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:var(--radius-sm);cursor:pointer}
.dd-item:hover{background:rgba(79,70,229,.07)}
.dd-item .dd-t{font-weight:600;font-size:13px}
.dd-item .dd-s{font-size:11.5px;color:var(--muted)}
.dd-empty{padding:18px;text-align:center;color:var(--muted);font-size:12.5px}
/* ---- 2.7 Cards & grids ---- */
#view{flex:1;padding:22px 24px 90px;max-width:1500px;width:100%;margin:0 auto}
.page{animation:fadeSlide .22s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.page-h .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.col-2{grid-column:span 2}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 0;flex-wrap:wrap}
.card-t{font-size:14px;font-weight:700}
.card-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.card-b{padding:14px 18px 18px}
.card-f{padding:0 18px 16px}
/* ---- 2.8 KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:15px 16px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.v-primary{background:linear-gradient(135deg,#4F46E5,#6D28D9)}
.v-violet{background:linear-gradient(135deg,#7C3AED,#A855F7)}
.v-cyan{background:linear-gradient(135deg,#06B6D4,#0891B2)}
.v-green{background:linear-gradient(135deg,#10B981,#059669)}
.v-amber{background:linear-gradient(135deg,#F59E0B,#D97706)}
.v-red{background:linear-gradient(135deg,#EF4444,#DC2626)}
.v-indigo{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.kpi-v{font-size:19px;font-weight:800;letter-spacing:-.3px}
.kpi-l{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.trend.up{color:#059669;background:rgba(16,185,129,.12)}
.trend.down{color:#DC2626;background:rgba(239,68,68,.12)}
.trend.flat{color:var(--muted);background:rgba(100,116,139,.12)}
/* ---- 2.9 Chips, dots, badges ---- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(100,116,139,.12);color:var(--muted);white-space:nowrap}
.chip.c-success{background:rgba(16,185,129,.13);color:#059669}
.chip.c-warning{background:rgba(245,158,11,.15);color:#B45309}
.chip.c-danger{background:rgba(239,68,68,.13);color:#DC2626}
.chip.c-primary{background:rgba(79,70,229,.12);color:#4F46E5}
.chip.c-cyan{background:rgba(6,182,212,.13);color:#0E7490}
.chip.c-muted{background:rgba(100,116,139,.12);color:var(--muted)}
html[data-theme="dark"] .chip.c-success{color:#34D399}
html[data-theme="dark"] .chip.c-warning{color:#FBBF24}
html[data-theme="dark"] .chip.c-danger{color:#F87171}
html[data-theme="dark"] .chip.c-primary{color:#A5B4FC}
html[data-theme="dark"] .chip.c-cyan{color:#22D3EE}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.c-success{background:var(--success)}.dot.c-warning{background:var(--warning)}.dot.c-danger{background:var(--danger)}.dot.c-muted{background:var(--muted)}
/* ---- 2.10 Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s ease;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
.btn-primary:hover:not(:disabled){box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s ease}
.btn-icon:hover{background:rgba(79,70,229,.1);color:var(--primary)}
.btn-icon.danger:hover{background:rgba(239,68,68,.12);color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.seg button{padding:7px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.seg button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
</style>
<style>
/* ---- 2.11 Tables ---- */
.table-wrap{overflow:auto;max-height:62vh;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl thead th.no-sort{cursor:default}
.tbl thead th:hover{color:var(--primary)}
.tbl tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even){background:rgba(244,246,251,.55)}
html[data-theme="dark"] .tbl tbody tr:nth-child(even){background:rgba(34,43,69,.35)}
.tbl tbody tr{transition:background .14s ease}
.tbl tbody tr:hover{background:rgba(79,70,229,.06)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .tname{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .tdim{color:var(--muted);font-size:12px}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.pgn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pgn .pg-tx{font-size:12px;color:var(--muted)}
.pgn .pg-btns{display:flex;gap:6px}
/* ---- 2.12 Forms ---- */
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 14px}
.f-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-field.f-full{grid-column:1/-1}
.f-field label{font-size:11.5px;font-weight:600;color:var(--muted)}
.f-field label .req{color:var(--danger)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);transition:border .15s ease,box-shadow .15s ease}
.inp:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.inp:disabled,.inp[readonly]{opacity:.65;background:var(--line);cursor:not-allowed}
textarea.inp{resize:vertical;min-height:64px}
.f-err{font-size:11px;color:var(--danger);display:none}
.f-field.err .inp{border-color:var(--danger)}
.f-field.err .f-err{display:block}
.f-sec{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary);border-bottom:1px dashed var(--line);padding-bottom:5px;margin-top:6px}
/* ---- 2.13 Drawer / modal ---- */
.dwrap,.mwrap{position:fixed;inset:0;z-index:100;display:none}
.dwrap.open,.mwrap.open{display:block}
.dscrim,.mscrim{position:absolute;inset:0;background:rgba(11,16,32,.45);opacity:0;transition:opacity .2s ease}
.dwrap.open .dscrim,.mwrap.open .mscrim{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(600px,96vw);background:var(--surface);box-shadow:-12px 0 40px rgba(15,23,42,.18);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-radius:var(--radius) 0 0 var(--radius)}
.dwrap.open .drawer{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:15.5px;font-weight:700}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 0 var(--radius)}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);width:min(430px,92vw);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-hover);opacity:0;transition:all .2s ease;padding:22px}
.mwrap.open .modal{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:15.5px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:13px;margin-bottom:18px}
.modal .modal-acts{display:flex;justify-content:flex-end;gap:9px}
/* ---- 2.14 Toasts ---- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,90vw)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--radius-sm);box-shadow:var(--shadow-hover);padding:11px 14px;font-size:13px;animation:toastIn .22s ease}
.toast.t-success{border-left-color:var(--success)}.toast.t-error{border-left-color:var(--danger)}.toast.t-info{border-left-color:var(--accent)}.toast.t-warn{border-left-color:var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- 2.15 Skeletons & empty ---- */
.skel{position:relative;overflow:hidden;background:var(--line);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.3s infinite}
html[data-theme="dark"] .skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-page{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.empty span{font-size:12.5px}
/* ---- 2.16 FAB ---- */
.fab{position:fixed;right:22px;bottom:22px;z-index:90}
.fab-main{width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(79,70,229,.4);display:flex;align-items:center;justify-content:center;transition:transform .18s ease}
.fab-main:hover{transform:rotate(90deg) scale(1.05)}
.fab-menu{position:absolute;bottom:64px;right:0;display:none;flex-direction:column;gap:6px;min-width:190px}
.fab-menu.open{display:flex;animation:fadeSlide .18s ease}
.fab-item{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.fab-item:hover{border-color:var(--primary);color:var(--primary)}
/* ---- 2.17 Tabs & misc ---- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:0}
.tab{padding:9px 14px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.ring-wrap{position:relative;display:inline-flex}
.ring-c{font-size:13px;font-weight:800;fill:var(--ink)}
.bbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.bbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s ease}
.bbar.hot i{background:linear-gradient(90deg,#F59E0B,#EF4444)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;font-size:9.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-7px}
.av:first-child{margin-left:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fitem{display:flex;flex-direction:column;gap:4px}
.fitem label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.fitem select,.fitem input{min-width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;font-size:11px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:120;pointer-events:none}
.proj-card{cursor:pointer;display:flex;flex-direction:column;gap:11px;padding:16px}
.proj-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj-name{font-weight:700;font-size:13.5px;line-height:1.35}
.proj-code{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin-top:2px}
.proj-meta{display:flex;gap:6px;flex-wrap:wrap}
.proj-fin{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
.proj-fin b{color:var(--ink);font-size:12.5px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:12.8px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{font-weight:600;word-break:break-word}
.chart-box{position:relative;height:250px}
.chart-box.tall{height:290px}
.bottomnav{display:none}
.mobile-scrim{display:none}
/* ---- 2.18 Responsive ---- */
@media (max-width:1100px){.col-2{grid-column:span 4}.col-3{grid-column:span 6}.col-4{grid-column:span 6}.col-6{grid-column:span 12}.col-8{grid-column:span 12}}
@media (max-width:860px){
  .side{transform:translateX(-102%);width:var(--side-w)!important}
  .side.open{transform:none}
  .side.min .brand-name,.side.min .nav-label,.side.min .nav-sec{display:block}
  .main{margin-left:0!important}
  .side-scrim.show{display:block;position:fixed;inset:0;background:rgba(11,16,32,.45);z-index:55}
  .tb-user-tx,.role-chip{display:none}
  .tb-city{width:110px}
  #view{padding:16px 14px 100px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:70;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;padding:5px 2px;border-radius:8px}
  .bottomnav button.active{color:var(--primary)}
  .f-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .fab{bottom:76px}
}
</style>
</head>

  var st = {page: 1, search: '', filters: {}, sort: Object.assign({}, mod.ds), params: opts.params || {}};
  var curRows = [];
  var cols = opts.cols || mod.cols.filter(function (k) { return (opts.hideCols || []).indexOf(k) < 0; });
  var idKey = (State.boot.schema[mod.sheet] || [])[0] ? State.boot.schema[mod.sheet][0].k : 'ID';

  function filterBar() {
    if (opts.embedded || !mod.filters.length) return '';
    var h = '<div class="filters">';
    mod.filters.forEach(function (f, fi) {
      h += '<div class="fitem"><label>' + esc(f.label) + '</label><select data-fi="' + fi + '"><option value="">All</option>';
      var list = [];
      if (f.type === 'cat') list = settingsOpts(f.cat || f.k);
      if (f.type === 'proj') list = State.boot.lookups.projects.map(function (p) { return p.id; });
      if (f.type === 'ven') list = State.boot.lookups.vendors.map(function (v) { return v.name; });
      if (f.type === 'list') list = typeof f.opts === 'function' ? f.opts() : f.opts;
      h += list.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select></div>';
    });
    h += '<div class="fitem"><label>Search</label><input type="search" data-modsearch placeholder="Type to search…" style="min-width:210px"></div>';
    h += '<button class="btn btn-ghost btn-sm" data-exp style="margin-bottom:1px">' + icon('download', 14) + ' Export CSV</button>';
    h += '</div>';
    return h;
  }
  function toolbar() {
    if (opts.embedded) return '';
    return '<div class="page-h"><div><h1>' + icon(mod.ic, 20) + ' ' + esc(mod.title) + '</h1><div class="sub">' + esc(mod.sub) + '</div></div>' +
      '<div class="page-actions">' +
      (u.canWrite && !mod.ro ? '<button class="btn btn-primary" data-add>' + icon('plus', 16) + ' Add ' + esc(mod.sheet) + '</button>' : '') +
      '</div></div>';
  }
  function shell(body) {
    mount.innerHTML = '<div class="page">' + toolbar() + filterBar() + '<div class="card" data-tblcard>' + body + '</div></div>';
    wire();
  }
  function bodyHTML(res) {
    return tableHTML(cols, res.rows, {ro: mod.ro, emptyT: 'No ' + mod.sheet + ' records', emptyS: u.canWrite && !mod.ro ? 'Use the Add button to create the first record.' : 'No records match your filters.'}) + pgnHTML(res.page, res.pages, res.total, res.pageSize);
  }
  function load() {
    var card = mount.querySelector('[data-tblcard]');
    if (card) card.innerHTML = '<div class="card-b">' + '<div class="skel" style="height:34px;margin-bottom:8px"></div>'.repeat(8) + '</div>';
    var params = Object.assign({page: st.page, search: st.search, filters: st.filters, sort: st.sort}, st.params);
    listCached(mod.sheet, params).then(function (res) {
      st.page = res.page;
      if (!mount.isConnected) return;
      curRows = res.rows;
      var c = mount.querySelector('[data-tblcard]');
      if (c) c.innerHTML = bodyHTML(res);
    }).catch(function (e) {
      var c = mount.querySelector('[data-tblcard]');
      if (c) c.innerHTML = emptyHTML('Could not load ' + mod.sheet, esc(e && e.message || ''));

  }
  function openForm(rec, title, isEdit) {
    var fb = buildForm(mod.sheet, rec || null, {defaults: opts.addValues});
    openDrawer(title || ((isEdit ? 'Edit ' : 'Add ') + mod.sheet), fb.root.outerHTML,
      '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-save>' + icon('checkc', 15) + ' Save</button>');
    var rootEl = $('#drawer-root');
    var real = fb.root; // move built node into drawer to preserve listeners
    rootEl.querySelector('.drawer-b').innerHTML = '';
    rootEl.querySelector('.drawer-b').appendChild(real);
    rootEl.querySelector('[data-cancel]').onclick = closeDrawer;
    rootEl.querySelector('[data-save]').onclick = function () {
      if (!fb.validate()) return;
      var btn = this; btn.disabled = true; btn.innerHTML = 'Saving…';
      var record = fb.get();
      if (isEdit && rec && rec[idKey]) record[idKey] = rec[idKey];
      api('saveRecord', {sheet: mod.sheet, record: record}).then(function (res) {
        inv(mod.sheet); closeDrawer();
        toast((res.created ? 'Created ' : 'Saved ') + mod.sheet + ' · ' + (res.record[idKey] || ''), 'success');
        load();
        if (opts.onChanged) opts.onChanged(res);
      }).catch(function () { btn.disabled = false; btn.innerHTML = icon('checkc', 15) + ' Save'; });
    };
  }
  function wire() {
    var fb = mount.querySelector('.filters');
    if (fb) {
      $$('[data-fi]', fb).forEach(function (selEl) {
        var f = mod.filters[parseInt(selEl.dataset.fi, 10)];
        selEl.onchange = function () { st.filters[f.k] = selEl.value; st.page = 1; load(); };
      });
      var si = fb.querySelector('[data-modsearch]');
      if (si) si.addEventListener('input', debounce(function () { st.search = si.value.trim(); st.page = 1; load(); }, 300));
      var ex = fb.querySelector('[data-exp]');
      if (ex) ex.onclick = function () { exportViewCSV(mod.sheet, {search: st.search, filters: st.filters, sort: st.sort}, cols); };
    }
    var addBtn = mount.querySelector('[data-add]');
    if (addBtn) addBtn.onclick = function () { openForm(null, 'Add ' + mod.sheet, false); };
    var card = mount.querySelector('[data-tblcard]');
    if (!card) return;
    card.addEventListener('click', function (ev) {
      var pg = ev.target.closest('[data-pg]');
      if (pg) { st.page += pg.dataset.pg === 'next' ? 1 : -1; load(); return; }
      var act = ev.target.closest('[data-act]');
      var tr = ev.target.closest('tr[data-i]');
      if (act && tr) {
        var row = curRows[parseInt(tr.dataset.i, 10)];
        if (!row) return;
        if (act.dataset.act === 'del') {
          confirmDialog('Delete ' + mod.sheet + '?', (row[idKey] || 'This record') + ' will be removed' + (mod.sheet === 'Projects' ? ' (soft delete — history is preserved).' : '. This is audited.'), true).then(function (yes) {
            if (!yes) return;
            tr.style.opacity = '.4';
            api('deleteRecord', {sheet: mod.sheet, id: row[idKey]}).then(function () {
              inv(mod.sheet); toast('Deleted ' + (row[idKey] || ''), 'success'); load();
              if (opts.onChanged) opts.onChanged();
            }).catch(function () { tr.style.opacity = '1'; });
          });
          return;
        }
        openForm(row, (act.dataset.act === 'edit' ? 'Edit ' : 'View ') + mod.sheet + ' · ' + (row[idKey] || ''), true);
        if (act.dataset.act === 'view') { var els = $$('#drawer-root .drawer-b input, #drawer-root .drawer-b select, #drawer-root .drawer-b textarea'); els.forEach(function (e) { e.disabled = true; }); $('#drawer-root [data-save]').style.display = 'none'; }
        return;
      }
      if (tr && opts.onRow) opts.onRow((State.cache.get('rows:' + mod.sheet) || {v: []}).v[parseInt(tr.dataset.i, 10)]);
    });
    $$('th[data-sort]', card).forEach(function (th) {
      th.onclick = function () {
        var k = th.dataset.sort;
        if (st.sort.col === k) st.sort.dir = st.sort.dir === 'asc' ? 'desc' : 'asc'; else st.sort = {col: k, dir: 'asc'};
        load();
      };
    });
  }
  shell('');
  load();
}

        }).join('') + '</div>';
      }
      h += '<div class="card"><div class="card-h"><div><div class="card-t">' + esc(cur === 'Users' ? 'Users & Roles' : cur) + '</div><div class="card-s">' + data.length + ' values · edit inline, then Save Changes</div></div>' +
        '<div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-addrow>' + icon('plus', 14) + ' Add row</button>' +
        '<button class="btn btn-primary btn-sm" data-saverow>' + icon('checkc', 14) + ' Save Changes</button></div></div>' +
        '<div class="table-wrap"><table class="tbl"><thead><tr><th style="width:34%">' + (isUsers ? 'Name' : 'Value') + '</th><th>' + (isUsers ? 'Email (Info 1)' : 'Info 1') + '</th><th>' + (isUsers ? 'Role (Info 2)' : 'Info 2') + '</th><th style="width:90px">Sort</th><th style="width:100px">Active</th><th style="width:70px"></th></tr></thead><tbody data-rows>';
      data.forEach(function (r) { h += rowHTML(r); });
      h += '</tbody></table></div></div>';
      box.innerHTML = h;
      function rowHTML(r) {
        var roleOpts = isUsers ? '<select class="inp" data-c="Info 2">' + settingsOpts('User Role').map(function (x) { return '<option' + (x === r['Info 2'] ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' : '<input class="inp" data-c="Info 2" value="' + esc(r['Info 2'] || '') + '">';
        return '<tr data-key="' + esc(r['Key'] || '') + '">' +
          '<td><input class="inp" data-c="Value" value="' + esc(r.Value || '') + '"></td>' +
          '<td><input class="inp" data-c="Info 1" value="' + esc(r['Info 1'] || '') + '"></td>' +
          '<td>' + roleOpts + '</td>' +
          '<td><input class="inp" type="number" data-c="Sort" value="' + esc(r.Sort === '' ? 0 : r.Sort) + '"></td>' +
          '<td><select class="inp" data-c="Active"><option' + (r.Active !== 'No' ? ' selected' : '') + '>Yes</option><option' + (r.Active === 'No' ? ' selected' : '') + '>No</option></select></td>' +
          '<td><button class="btn-icon danger" data-delrow aria-label="Remove row">' + icon('trash', 15) + '</button></td></tr>';
      }
      $$(('[data-cat]'), box).forEach(function (b) { b.onclick = function () { cat = b.dataset.cat; draw(); }; });
      var addB = box.querySelector('[data-addrow]');
      if (addB) addB.onclick = function () {
        var tb = box.querySelector('[data-rows]');
        var div = document.createElement('div');
        div.innerHTML = '<tr data-key=""><td><input class="inp" data-c="Value" value=""></td><td><input class="inp" data-c="Info 1" value=""></td><td><input class="inp" data-c="Info 2" value=""></td><td><input class="inp" type="number" data-c="Sort" value="' + (data.length + 1) + '"></td><td><select class="inp" data-c="Active"><option selected>Yes</option><option>No</option></select></td><td><button class="btn-icon danger" data-delrow aria-label="Remove row">' + icon('trash', 15) + '</button></td></tr>';
        tb.appendChild(div.firstChild);
        wireDel(tb);
      };
      function wireDel(scope) {
        $$('[data-delrow]', scope || box).forEach(function (b) {
          b.onclick = function () {
            var tr = b.closest('tr');
            var key = tr.dataset.key;
            if (!key) { tr.remove(); return; }
            confirmDialog('Remove value?', 'It will be deleted from "' + cur + '" (audited).', true).then(function (yes) {
              if (!yes) return;
              api('deleteRecord', {sheet: 'Settings', id: key}).then(function () { tr.remove(); toast('Value removed.', 'success'); refreshBoot(); });
            });
          };
        });
      }
      wireDel();
      var saveB = box.querySelector('[data-saverow]');
      if (saveB) saveB.onclick = function () {
        var trs = $$('[data-rows] tr', box);
        var ops = [];
        trs.forEach(function (tr) {
          var val = tr.querySelector('[data-c="Value"]').value.trim();
          if (!val) return;
          ops.push({key: tr.dataset.key, rec: {
            Category: cur, Value: val,
            'Info 1': tr.querySelector('[data-c="Info 1"]').value.trim(),
            'Info 2': tr.querySelector('[data-c="Info 2"]').value.trim(),
            Sort: num(tr.querySelector('[data-c="Sort"]').value), Active: tr.querySelector('[data-c="Active"]').value
          }});
        });
        saveB.disabled = true;
        var chain = Promise.resolve(), done = 0;
        ops.forEach(function (op) {
          chain = chain.then(function () {
            var rec = op.rec; if (op.key) rec.Key = op.key;
            return api('saveRecord', {sheet: 'Settings', record: rec}).then(function () { done++; });
          });
        });
        chain.then(function () {
          saveB.disabled = false; toast('Saved ' + done + ' setting rows.', 'success'); refreshBoot();
        }).catch(function () { saveB.disabled = false; });
      };
    });
  }
  function refreshBoot() {
    api('getBootstrapData').then(function (b) { State.boot = b; paintUser(); buildNav(); }).catch(function () {});
  }
  draw();
}

/* ── 4.10 TOPBAR, FAB, BOTTOM NAV, THEME, BOOT ─────────────────────────────────── */
function paintUser() {
  var u = State.boot.user;
  $('#tb-name').textContent = u.name; $('#side-name').textContent = u.name;
  $('#tb-role').textContent = u.role; $('#side-role').textContent = u.email || u.role;
  $('#tb-av').textContent = initials(u.name); $('#side-av').textContent = initials(u.name);
}
function buildFab() {
  var items = [
    {sheet: 'DPR', label: 'Add DPR', ic: 'clipboard'},
    {sheet: 'Billing', label: 'Add RA Bill', ic: 'receipt'},
    {sheet: 'Procurement', label: 'Add PO/WO', ic: 'cart'},
    {sheet: 'Snags & Handover', label: 'Add Snag', ic: 'checkc'}
  ];
  var fab = $('#fab');
  fab.innerHTML = '<div class="fab-menu" id="fabmenu">' + items.map(function (i) {
    return '<button class="fab-item" data-fsheet="' + esc(i.sheet) + '">' + icon(i.ic, 16) + esc(i.label) + '</button>';
  }).join('') + '</div><button class="fab-main" id="fabbtn" aria-label="Quick actions">' + icon('plus', 22) + '</button>';
  $('#fabbtn').onclick = function (e) { e.stopPropagation(); $('#fabmenu').classList.toggle('open'); };
  $$('#fabmenu .fab-item').forEach(function (b) {
    b.onclick = function () {
      $('#fabmenu').classList.remove('open');
      quickAdd(b.dataset.fsheet);
    };
  });
}
function quickAdd(sheet) {
  var meta = State.boot.schema[sheet] || [];
  var m = parseHash();
  var defaults = {};
  if (m.k === 'project') defaults['Project ID'] = m.id;
  var fb2 = buildForm(sheet, null, {defaults: defaults});
  openDrawer('Quick Add · ' + sheet, '', '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-save>' + icon('checkc', 15) + ' Save</button>');
  var rootEl = $('#drawer-root');
  rootEl.querySelector('.drawer-b').appendChild(fb2.root);
  rootEl.querySelector('[data-cancel]').onclick = closeDrawer;
  rootEl.querySelector('[data-save]').onclick = function () {
    if (!fb2.validate()) return;
    var btn = this; btn.disabled = true; btn.innerHTML = 'Saving…';
    api('saveRecord', {sheet: sheet, record: fb2.get()}).then(function (res) {
      inv(sheet); closeDrawer();
      toast('Saved ' + (res.record[(meta[0] || {}).k] || sheet), 'success');
      renderRoute();
    }).catch(function () { btn.disabled = false; btn.innerHTML = icon('checkc', 15) + ' Save'; });
  };
}
function buildBottomNav() {
  var bn = $('#bnav');
  var items = [
    {k: 'dashboard', ic: 'home', l: 'Home', h: '#/dashboard'},
    {k: 'projects', ic: 'building', l: 'Projects', h: '#/projects'},
    {k: 'add', ic: 'plus', l: 'Add', h: '#'},
    {k: 'billing', ic: 'receipt', l: 'Billing', h: '#/m/billing'},
    {k: 'more', ic: 'menu', l: 'More', h: '#'}
  ];
  bn.innerHTML = items.map(function (i) { return '<button data-nav="' + i.k + '" data-bh="' + i.h + '">' + icon(i.ic, 19) + i.l + '</button>'; }).join('');
  bn.onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.nav === 'add') { $('#fabmenu').classList.toggle('open'); return; }
    if (b.dataset.nav === 'more') { openSidebar(); return; }
    location.hash = b.dataset.bh;
  };
}
function openSidebar() { $('#sidebar').classList.add('open'); $('#side-scrim').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#side-scrim').classList.remove('show'); }
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem('astra-theme', dark ? 'dark' : 'light'); } catch (e) {}
  $('#themebtn').innerHTML = icon(dark ? 'sun' : 'moon', 17);
}
function wireTopbar() {
  $('#burger').innerHTML = icon('menu', 18);
  $('#bellbtn').innerHTML = icon('bell', 17);
  $('#themebtn').innerHTML = icon(document.documentElement.getAttribute('data-theme') === 'dark' ? 'sun' : 'moon', 17);
  var side = $('#sidebar');
  $('#burger').onclick = function () {
    if (window.innerWidth <= 860) { side.classList.contains('open') ? closeSidebar() : openSidebar(); }
    else { side.classList.toggle('min'); $('#maincol').classList.toggle('min'); try { localStorage.setItem('astra-side', side.classList.contains('min') ? '1' : ''); } catch (e) {} }
  };
  $('#side-scrim').onclick = closeSidebar;
  $('#nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-hash]');
    if (!b) return;
    if (location.hash === b.dataset.hash) renderRoute(); else location.hash = b.dataset.hash;
    if (window.innerWidth <= 860) closeSidebar();
  });
  $('#themebtn').onclick = function () { applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'); renderRoute(); };
  // city filter
  var cs = $('#citysel');
  cs.innerHTML = '<option value="">All Cities</option>' + settingsOpts('City/Branch').map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  cs.onchange = function () { State.g.city = cs.value; State.dash.city = cs.value; renderRoute(); };
  // notifications
  var bp = $('#bellpanel');
  $('#bellbtn').onclick = function (e) {
    e.stopPropagation();
    var open = bp.classList.contains('open');
    $$('.dropdown').forEach(function (d) { if (d !== bp) d.classList.remove('open'); });
    bp.classList.toggle('open', !open);
    if (!open) {
      bp.innerHTML = '<div class="dd-empty">Loading…</div>';
      api('getNotifications').then(function (n) {
        if (!bp.isConnected) return;
        $('#bellbtn').innerHTML = icon('bell', 17);
        bp.innerHTML = '<div style="padding:6px 10px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px">Alerts · ' + n.total + '</div>' +
          (n.items.length ? n.items.map(function (i) {
            return '<button class="dd-item" data-go="' + esc(i.route) + '"><span style="color:' + (i.type === 'delay' ? 'var(--danger)' : i.type === 'milestone' ? 'var(--warning)' : i.type === 'bill' ? 'var(--primary)' : 'var(--accent)') + ';margin-top:1px">' + icon(i.icon === 'alert' ? 'alert' : i.icon, 15) + '</span><span><span class="dd-t">' + esc(i.label) + '</span><br><span class="dd-s">' + esc(i.sub) + '</span></span></button>';
          }).join('') : '<div class="dd-empty">All clear 🎉</div>');
        $$('[data-go]', bp).forEach(function (b) { b.onclick = function () { bp.classList.remove('open'); location.hash = b.dataset.go; }; });
      }).catch(function () { bp.innerHTML = '<div class="dd-empty">Could not load alerts.</div>'; });
    }
  };
  document.addEventListener('click', function () { $$('.dropdown').forEach(function (d) { d.classList.remove('open'); }); });
  $$('.dropdown').forEach(function (d) { d.addEventListener('click', function (e) { e.stopPropagation(); }); });
  // global search
  var gs = $('#gsearch'), gd = $('#gsearch-drop');
  gs.addEventListener('input', debounce(function () {
    var q = gs.value.trim();
    if (q.length < 2) { gd.classList.remove('open'); return; }
    api('listRecords', {sheet: 'Projects', search: q, pageSize: 8}).then(function (res) {
      gd.innerHTML = res.rows.length ? res.rows.map(function (r) {
        return '<button class="dd-item" data-id="' + esc(r['Project ID']) + '"><span style="color:var(--primary);margin-top:1px">' + icon('building', 15) + '</span><span><span class="dd-t">' + esc(r['Project Code']) + ' · ' + esc(r['Project Name']) + '</span><br><span class="dd-s">' + esc(r['Client Name'] || '') + ' · ' + esc(r['City'] || '') + ' · ' + esc(r['Status'] || '') + '</span></span></button>';
      }).join('') : '<div class="dd-empty">No projects match "' + esc(q) + '"</div>';
      gd.classList.add('open');
      $$('[data-id]', gd).forEach(function (b) {
        b.onclick = function () { gd.classList.remove('open'); gs.value = ''; location.hash = '#/projects/' + b.dataset.id; };
      });
    }).catch(function () { gd.classList.remove('open'); });
  }, 300));
  gs.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var f = gd.querySelector('[data-id]'); if (f) f.click(); }
    if (e.key === 'Escape') gd.classList.remove('open');
  });
}
function boot() {
  api('getBootstrapData').then(function (b) {
    State.boot = b;
    paintUser(); buildNav(); buildFab(); buildBottomNav(); wireTopbar();
    try {
      var saved = localStorage.getItem('astra-theme');
      applyTheme(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (localStorage.getItem('astra-side')) { $('#sidebar').classList.add('min'); $('#maincol').classList.add('min'); }
    } catch (e) {}
    if (!location.hash) location.hash = '#/dashboard';
    renderRoute();
    // bell badge
    api('getNotifications').then(function (n) {
      if (n.total > 0) $('#bellbtn').innerHTML = icon('bell', 17) + '<span class="badge">' + (n.total > 9 ? '9+' : n.total) + '</span>';
    }).catch(function () {});
  }).catch(function (e) {
    $('#view').innerHTML = '<div class="page">' + emptyHTML('Could not start the app', String(e && e.message || e) + ' — make sure you ran Setup System from the spreadsheet menu.') + '</div>';
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
